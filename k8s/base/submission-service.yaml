apiVersion: v1
kind: Service
metadata:
  name: submission-service
spec:
  selector:
    app: submission-service
  ports:
    - name: http
      port: 4002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: submission-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: submission-service
  template:
    metadata:
      labels:
        app: submission-service
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: submission-service
          image: codearena-submission-service
          ports:
            - containerPort: 4002
          envFrom:
            - configMapRef:
                name: codearena-config
          env:
            - name: PORT
              value: "4002"
            - name: DB_NAME
              value: submissions_db
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: codearena-secrets
                  key: POSTGRES_PASSWORD
            - name: INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: codearena-secrets
                  key: INTERNAL_TOKEN
          readinessProbe:
            httpGet:
              path: /health
              port: 4002
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4002
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
