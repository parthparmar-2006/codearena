# No Service: the judge has no API. Its /health port is only used by the probes below.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: judge-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: judge-service
  template:
    metadata:
      labels:
        app: judge-service
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: judge-service
          image: codearena-judge-service
          ports:
            - containerPort: 4003
          envFrom:
            - configMapRef:
                name: codearena-config
          env:
            - name: HEALTH_PORT
              value: "4003"
            - name: INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: codearena-secrets
                  key: INTERNAL_TOKEN
          readinessProbe:
            httpGet:
              path: /health
              port: 4003
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4003
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 200Mi
