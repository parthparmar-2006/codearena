# /internal routes are deliberately not listed, so they can never be reached from outside.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codearena
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api/problems
            pathType: Prefix
            backend:
              service:
                name: problem-service
                port:
                  number: 4001
          - path: /api/submissions
            pathType: Prefix
            backend:
              service:
                name: submission-service
                port:
                  number: 4002
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 8080
