# The judge runs untrusted code, so it may only talk to the services it needs and to DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: judge-egress
spec:
  podSelector:
    matchLabels:
      app: judge-service
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: problem-service
      ports:
        - port: 4001
    - to:
        - podSelector:
            matchLabels:
              app: submission-service
      ports:
        - port: 4002
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - port: 6379
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: problem-service
        - podSelector:
            matchLabels:
              app: submission-service
      ports:
        - port: 5432
