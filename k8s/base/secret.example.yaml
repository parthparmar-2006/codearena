# Documentation only: this file is not part of kustomization.yaml and must never hold real values.
# Create the real secret with:
#   kubectl -n codearena create secret generic codearena-secrets \
#     --from-literal=POSTGRES_PASSWORD='<strong password>' \
#     --from-literal=INTERNAL_TOKEN='<long random string>'
apiVersion: v1
kind: Secret
metadata:
  name: codearena-secrets
  namespace: codearena
type: Opaque
stringData:
  POSTGRES_PASSWORD: change-me
  INTERNAL_TOKEN: change-me
