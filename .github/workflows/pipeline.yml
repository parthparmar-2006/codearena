name: pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

env:
  TRIVY_IMAGE: aquasec/trivy:0.76.1

jobs:
  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks (full git history)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.30.1 git /repo --redact --verbose --no-banner

  test:
    name: Test ${{ matrix.service }}
    needs: secrets-scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: problem-service
            path: services/problem-service
          - service: submission-service
            path: services/submission-service
          - service: judge-service
            path: services/judge-service
          - service: frontend
            path: frontend
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json
      - run: npm ci
      - name: Test or build
        run: ${{ matrix.service == 'frontend' && 'npm run build' || 'npm test' }}
      - name: Audit production dependencies
        run: npm audit --audit-level=high --omit=dev

  iac-scan:
    name: IaC scan
    needs: secrets-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Trivy config scan of Terraform and Kubernetes
        run: |
          for dir in infra k8s; do
            docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" config \
              --severity HIGH,CRITICAL --exit-code 1 --ignorefile .trivyignore "$dir"
          done

  build-scan-push:
    name: Build, scan, push ${{ matrix.service }}
    needs: [test, iac-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: problem-service
            path: services/problem-service
          - service: submission-service
            path: services/submission-service
          - service: judge-service
            path: services/judge-service
          - service: frontend
            path: frontend
    steps:
      - uses: actions/checkout@v7
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/codearena-${{ matrix.service }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.path }}
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Trivy report (HIGH and CRITICAL) as SARIF
        run: |
          mkdir -p "$HOME/.cache/trivy"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" -v "$PWD:/out" "$TRIVY_IMAGE" image \
            --severity HIGH,CRITICAL --format sarif --output /out/trivy.sarif "$IMAGE:$GITHUB_SHA"
      - name: Upload SARIF to the Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.service }}
      - name: Fail on fixable CRITICAL vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" "$TRIVY_IMAGE" image \
            --severity CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE:$GITHUB_SHA"
      - name: Push
        run: |
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

  deploy:
    name: Deploy to k3s
    needs: build-scan-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
    steps:
      - uses: actions/checkout@v7
      - name: Pin image tags to this commit
        working-directory: k8s/overlays/prod
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for svc in problem-service submission-service judge-service frontend; do
            kustomize edit set image "codearena-$svc=ghcr.io/$owner/codearena-$svc:$GITHUB_SHA"
          done
      - name: Render manifests
        run: kustomize build k8s/overlays/prod > codearena.yaml
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
      - name: Copy manifests to the server
        run: scp codearena.yaml "$EC2_USER@$EC2_HOST:/tmp/codearena.yaml"
      - name: Create or update the namespace and secret
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
        run: |
          ssh "$EC2_USER@$EC2_HOST" \
            'sudo k3s kubectl create namespace codearena --dry-run=client -o yaml | sudo k3s kubectl apply -f -'
          kubectl create secret generic codearena-secrets --namespace codearena \
            --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --from-literal=INTERNAL_TOKEN="$INTERNAL_TOKEN" \
            --dry-run=client -o yaml \
            | ssh "$EC2_USER@$EC2_HOST" 'sudo k3s kubectl apply -f -'
      - name: Apply and wait for rollout
        run: |
          ssh "$EC2_USER@$EC2_HOST" 'bash -s' <<'EOF'
          set -euo pipefail
          k="sudo k3s kubectl -n codearena"
          sudo k3s kubectl apply -f /tmp/codearena.yaml
          $k rollout status statefulset/postgres --timeout=300s
          for d in redis problem-service submission-service judge-service frontend; do
            $k rollout status "deployment/$d" --timeout=300s
          done
          $k get pods,hpa
          EOF

  dast:
    name: DAST
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: OWASP ZAP baseline scan (warnings do not fail the build)
        env:
          TARGET: http://${{ secrets.EC2_HOST }}.nip.io
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm -v "$PWD/zap:/zap/wrk" zaproxy/zap-stable:2.17.0 \
            zap-baseline.py -t "$TARGET" -r zap-report.html -J zap-report.json -I
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: zap-report
          path: zap/
